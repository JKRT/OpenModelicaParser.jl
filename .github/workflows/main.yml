name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia-version: ['1.13']
    name: Test (${{ matrix.os }}, Julia ${{ matrix.julia-version }})
    permissions:
      contents: write  # the coverage badge file on gh-pages
    steps:
    - uses: actions/checkout@v4

    - uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.julia-version }}

    # The shared action checks the siblings out at the branch that matches this
    # change (the PR branch if the sibling has it, else the PR base branch, else
    # master).
    - name: Clone sibling OM.jl packages
      uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
      with:
        path: ..
        packages: ImmutableList

    - name: Develop sibling ImmutableList
      shell: bash
      run: |
        julia --color=yes --project -e '
          import Pkg
          Pkg.Registry.add("General")
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
          Pkg.develop([
            Pkg.PackageSpec(path="../ImmutableList.jl"),
          ])
          Pkg.instantiate()
        '

    # Coverage on Linux only (Pkg.test's --code-coverage=@<package>).
    - name: Test
      shell: bash
      env:
        COVERAGE: ${{ runner.os == 'Linux' }}
      run: julia --color=yes --project -e 'import Pkg; Pkg.test("OpenModelicaParser"; coverage = ENV["COVERAGE"] == "true")'

    - uses: julia-actions/julia-processcoverage@v1
      if: runner.os == 'Linux'
      with:
        directories: src

    # The coverage in the job summary and, on master, coverage.json on gh-pages for the README's badge (no external
    # service; the action is shared by the OM.jl packages).
    - name: Coverage
      if: runner.os == 'Linux'
      uses: JKRT/OM.jl/.github/actions/coverage@master
      with:
        name: OpenModelicaParser.jl/src
        publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
